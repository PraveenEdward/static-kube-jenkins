apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-website

spec:
  replicas: 2

  selector:
    matchLabels:
      app: static-website

  template:
    metadata:
      labels:
        app: static-website

    spec:
      containers:
        - name: nginx
          image: praveenedward/static-website:v1
          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 100m
              memory: 64Mi

            limits:
              cpu: 200m
              memory: 128Mi

---

apiVersion: v1
kind: Service
metadata:
  name: static-website

spec:
  type: ClusterIP

  selector:
    app: static-website

  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: static-website

spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: static-website
                port:
                  number: 80

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: static-website

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: static-website

  minReplicas: 2
  maxReplicas: 4

  metrics:
    - type: Resource
      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 50
